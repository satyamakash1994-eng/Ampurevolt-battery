<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ampurevolt 60V 30Ah Battery Showcase</title>
    <script src="https://tailwindcss.com"></script>
    <style>
        @import url('https://googleapis.com');
        body { font-family: 'Rajdhani', sans-serif; background-color: #0b0f19; color: #f3f4f6; overflow-x: hidden; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .glow-green { box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-black">
    <header class="border-b border-gray-800 bg-gray-900/80 backdrop-blur-md sticky top-0 z-40 px-4 py-3 sm:px-6">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="h-9 w-9 rounded-lg bg-gradient-to-br from-emerald-400 to-cyan-500 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                    <svg class="h-5 w-5 text-gray-950 stroke-[2.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                </div>
                <div>
                    <span class="font-orbitron font-extrabold text-lg sm:text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400">AMPUREVOLT</span>
                    <span class="text-xs block text-gray-400 font-medium tracking-widest uppercase -mt-1">Batteries Pvt. Ltd.</span>
                </div>
            </div>
            <button class="px-4 py-1.5 rounded-full border border-emerald-500/40 text-emerald-400 text-sm font-semibold hover:bg-emerald-500 hover:text-gray-950 transition-all duration-300">Order Inquiry</button>
        </div>
    </header>
    <main class="p-8 max-w-7xl mx-auto text-center flex-grow flex items-center justify-center">
        <div class="bg-gray-900/40 border border-gray-800 rounded-2xl p-8 max-w-2xl mx-auto glow-green">
            <h1 class="font-orbitron font-black text-4xl sm:text-5xl text-white mb-4">Ampurevolt 60V 30Ah NMC Battery</h1>
            <p class="text-emerald-400 font-bold tracking-widest uppercase mb-6">Advanced Lithium & Energy Storage Solutions</p>
            <div class="text-left bg-gray-950/60 p-6 rounded-xl border border-gray-800 space-y-3 text-base text-gray-300">
                <p>⚡ **Capacity:** 60V 30Ah NMC Battery Pack</p>
                <p>⚙️ **Application:** Electric Vehicles / Commercial Smart BMS</p>
                <p>🏢 **Company:** Ampurevolt Battery Pvt Limited, Delhi</p>
            </div>
        </div>
    </main>
</body>
</html>
